# Publishes smx-mcp to npm and to the MCP Registry (io.github.Space-Markets-HQ/smx-mcp).
#
# OFF BY DEFAULT. It runs only when BOTH are true:
#   1. a version tag matching v* is pushed (never on pull requests or pushes to main), and
#   2. the repository variable PUBLISH_ENABLED is set to "true" (Settings > Secrets and variables > Actions > Variables).
# It also needs the NPM_TOKEN repository secret, and package.json must no longer have "private": true or the
# prepublishOnly guard (both are still in place on purpose; see PUBLISHING.md).
# MCP Registry auth uses GitHub OIDC (mcp-publisher login github-oidc), so no registry secret is needed.
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ vars.PUBLISH_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC for the MCP Registry
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Check tag matches package.json, server.json and mcpName
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          SRV_VERSION=$(node -p "require('./server.json').version")
          SRV_PKG_VERSION=$(node -p "require('./server.json').packages[0].version")
          MCP_NAME=$(node -p "require('./package.json').mcpName")
          SRV_NAME=$(node -p "require('./server.json').name")
          echo "tag=$TAG_VERSION package=$PKG_VERSION server=$SRV_VERSION server.packages[0]=$SRV_PKG_VERSION"
          test "$TAG_VERSION" = "$PKG_VERSION"
          test "$TAG_VERSION" = "$SRV_VERSION"
          test "$TAG_VERSION" = "$SRV_PKG_VERSION"
          test "$MCP_NAME" = "$SRV_NAME"
          test "$MCP_NAME" = "io.github.Space-Markets-HQ/smx-mcp"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Idempotent: a re-run after a later step failed must not fail here on "cannot publish over
      # the previously published version".
      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "smx-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "smx-mcp@$VERSION is already on npm; skipping npm publish"
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The MCP Registry validates the npm package version; a fresh npm release can take a minute
      # to be visible (v0.1.1 failed with "version '0.1.1' was not found (status: 404)").
      - name: Wait for the npm version to be visible
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for i in $(seq 1 30); do
            if [ "$(npm view "smx-mcp@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "smx-mcp@$VERSION visible on npm"; exit 0
            fi
            echo "waiting for smx-mcp@$VERSION on npm ($i/30)"; sleep 10
          done
          echo "smx-mcp@$VERSION not visible on npm after 5 minutes"; exit 1

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --help >/dev/null

      - name: Log in to the MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: |
          for i in 1 2 3 4 5; do
            if ./mcp-publisher publish; then exit 0; fi
            echo "registry publish attempt $i failed; retrying in 30s"; sleep 30
          done
          exit 1
